<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rye&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <section>
            <div class="logo">
                <a href="index.html">Red <span class="logo-red">Dead</span> Web</a>
            </div>
            <nav class="nav-links">
                <a href="tela_historia.html">HISTORIA</a>
                <a href="tela_quiz">QUIZ DE HONRA</a>
                <a href="tela_reflexao.html">REFLEXÃO</a>
                <a href="tela_login.html" class="entrar" id="linkPerfil">ENTRAR</a>
                <a href="#" class="entrar" id="linkSair" onclick="limparSessao()" style="display: none;">SAIR</a>
            </nav>
        </section>
    </header>

    <div class="cadastro">
        <p class="subtitulo-cadastro">BEM VINDO A GANGUE</p>
        <h1>Cadastro</h1>

        <div class="caixa">
            <label for="ipt_nome">NOME</label>
            <input type="text" id="ipt_nome" placeholder="Seu nome">
            <p id="erro_nome"></p>

            <label for="ipt_email">E-MAIL</label>
            <input type="text" id="ipt_email" placeholder="seuemail@exemplo.com">
            <p id="erro_email"></p>

            <label for="ipt_senha">SENHA</label>
            <input onkeyup="senha()" type="password" id="ipt_senha" placeholder="******">
            <p id="erro_senha"></p>

            <label for="ipt_confSenha">CONFIRMAR SENHA</label>
            <input type="password" id="ipt_confSenha" placeholder="******">
            <p id="erro_confsenha"></p>

            <label for="regra_senha" class="regra_senha">
                <p id="regraTamanho"></p>
                <p id="regraNumero"></p>
                <p id="regraMinuscula"></p>
                <p id="regraMaiuscula"></p>
                <p id="regraEspecial"></p>
            </label>

            <br><button onclick="cadastrar()" class="button-cadastrar">Cadastrar</button>
            <p id="erro_confsenhaButton"></p>
            <p class="link-entrar">
                Já é um Cowboy? <a href="tela_login.html" class="entrar">Entrar</a>
            </p>
        </div>
    </div>
    <footer class="footer">
        <p>Feito por <a href="https://github.com/guilhermysantana" target="_blank">Guilhermy Santana</a> - CCOK @ São
            Paulo
            Tech School</p>
    </footer>

    <script src="js/cadastro.js"></script>
    <script src="js/sessao.js"></script>
</body>

</html>
